; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; デバイス共通設定
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    m5stack/M5Unified @ ^0.2.10                     ; M5Stackメインコントローラ向けデバイスドライバライブラリ
    bblanchon/ArduinoJson @ ^7.1.0                  ; JSONデータ解析、作成

; M5Stack Basic用
[env:m5stack-core-esp32]
board = m5stack-core-esp32
board_build.partitions = no_ota.csv                 ; OTA不使用のためアプリ・LittleFS領域を拡張。具体的な配分は同名ファイル（no_ota.csv）を参照
                                                    ; 適用後は必ず再書き込みが必要（パーティション構成変更のため）

; M5Stack CoreS3用のビルド環境は、v1.0.0時点でcores3-v1.0.0ブランチへ切り出し済み。
; mainはBasic専用として運用するため、本ファイルからは削除している（実機未検証のためCoreS3対応を謳わない）。
; CoreS3対応を再開する場合は、cores3-v1.0.0ブランチの[env:m5Stack-cores3]を参照のこと。