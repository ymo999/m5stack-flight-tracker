<!DOCTYPE html>
<!--
filename : api_key.html
description : APIキー設定ページ - API Key Settings Page
created : 2026-08-07
update : 2026-08-21
-->
<html lang="ja">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>APIキー設定</title>
	<style>
		:root {
			--bg: #0B1220;
			--panel: #121B2E;
			--panel-border: #223049;
			--amber: #F5A623;
			--text: #E8EDF4;
			--text-muted: #7C8AA0;
			--font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", sans-serif;
			--font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
		}
		* { box-sizing: border-box; }
		body {
			margin: 0;
			min-height: 100vh;
			background: var(--bg);
			color: var(--text);
			font-family: var(--font-display);
			display: flex;
			align-items: center;
			justify-content: center;
			padding: 24px 16px;
			-webkit-font-smoothing: antialiased;
		}
		form {
			width: 100%;
			max-width: 360px;
			padding: 22px 24px 26px;
		}
		.eyebrow {
			font-size: 12px;
			color: var(--text-muted);
			letter-spacing: 0.04em;
			text-transform: uppercase;
			margin: 0 0 4px;
		}
		.title {
			font-size: 22px;
			font-weight: 700;
			margin: 0 0 20px;
		}
		.field { margin-bottom: 18px; }
		.field label {
			display: block;
			font-size: 12px;
			font-weight: 600;
			letter-spacing: 0.04em;
			color: var(--text-muted);
			margin-bottom: 7px;
			text-transform: uppercase;
		}
		.field .hint {
			display: block;
			font-size: 12px;
			color: var(--text-muted);
			margin-top: 6px;
			line-height: 1.6;
		}
		.hint a {
			color: var(--amber);
			text-decoration: underline;
		}
		input[type="text"] {
			width: 100%;
			background: #0D1626;
			border: 1px solid var(--panel-border);
			color: var(--text);
			font-family: var(--font-mono);
			font-size: 14px;
			padding: 11px 12px;
			border-radius: 8px;
			outline: none;
			transition: border-color 0.15s ease;
			-webkit-appearance: none;
			appearance: none;
		}
		input[type="text"]:focus {
			border-color: var(--amber);
			box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.18);
		}
		button {
			width: 100%;
			background: var(--amber);
			color: #1A1206;
			font-family: var(--font-display);
			font-size: 14px;
			font-weight: 700;
			letter-spacing: 0.02em;
			border: none;
			border-radius: 8px;
			padding: 13px;
			cursor: pointer;
			transition: filter 0.15s ease;
		}
		button:hover { filter: brightness(1.08); }
		button:active { filter: brightness(0.94); }
		button:focus-visible {
			outline: 2px solid var(--amber);
			outline-offset: 2px;
		}
	</style>
</head>
<body>
	<form action="/api_key" method="POST">
		<p class="eyebrow">M5Stack Flight Tracker</p>
		<h1 class="title">APIキー設定</h1>

		<div class="field">
			<label for="apikey">AirLabs APIキー</label>
			<input type="text" id="apikey" name="apikey" required autocomplete="off">
			<span class="hint">
				airlabs.co のアカウントで取得したAPIキーを入力してください（未登録の場合は
				<a href="https://airlabs.co/" target="_blank" rel="noopener noreferrer">airlabs.co</a>
				から新規登録できます）
			</span>
		</div>

		<button type="submit">保存</button>
	</form>
</body>
</html>
