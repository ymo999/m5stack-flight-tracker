<!DOCTYPE html>
<!--
filename : wifi.html
description : 初回設定ページ - Initial Setup Page (Wi-Fi Credentials and Network Information)
created : 2026-08-07
update : 
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wi-Fi Setup</title>
<style>
    /* ============================================================
       トークン定義（CDN不要・システムフォントのみで構成）
       APモード中はインターネットに接続できないため、
       外部フォント／外部アセットは一切使用しない。
       ============================================================ */
    :root {
        --bg: #0B1220;
        --panel: #121B2E;
        --panel-border: #223049;
        --amber: #F5A623;
        --cyan: #4FD1C5;
        --text: #E8EDF4;
        --text-muted: #7C8AA0;
        --danger: #E8615A;

        --font-display: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
        --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    }

    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-display);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        -webkit-font-smoothing: antialiased;
    }

    /* ============================================================
       フォーム本体
       ============================================================ */
    form {
        padding: 22px 24px 26px;
    }

    .field {
        margin-bottom: 18px;
    }

    .field label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.04em;
        color: var(--text-muted);
        margin-bottom: 7px;
        text-transform: uppercase;
    }

    .field .hint {
        display: block;
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 6px;
        font-weight: 400;
        text-transform: none;
        letter-spacing: normal;
        line-height: 1.4;
    }

    input[type="text"],
    input[type="password"],
    select {
        width: 100%;
        background: #0D1626;
        border: 1px solid var(--panel-border);
        color: var(--text);
        font-family: var(--font-mono);
        font-size: 14px;
        padding: 11px 12px;
        border-radius: 8px;
        outline: none;
        transition: border-color 0.15s ease;
        -webkit-appearance: none;
        appearance: none;
    }

    input[type="text"]:focus,
    input[type="password"]:focus,
    select:focus {
        border-color: var(--amber);
        box-shadow: 0 0 0 3px rgba(245, 166, 35, 0.18);
    }

    select {
        background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6'%3E%3Cpath d='M0 0l5 6 5-6z' fill='%237C8AA0'/%3E%3C/svg%3E");
        background-repeat: no-repeat;
        background-position: right 14px center;
        padding-right: 32px;
    }

    /* 静的IP関連フィールド：折りたたみ */
    #staticFields {
        display: none;
        padding-top: 4px;
        border-top: 1px dashed var(--panel-border);
        margin-top: 4px;
    }

    #staticFields .field:first-child {
        margin-top: 16px;
    }

    .status-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-family: var(--font-mono);
        font-size: 11px;
        color: var(--text-muted);
        margin-bottom: 20px;
        letter-spacing: 0.04em;
    }

    .status-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--cyan);
        box-shadow: 0 0 0 3px rgba(79, 209, 197, 0.18);
        flex-shrink: 0;
    }

    button {
        width: 100%;
        background: var(--amber);
        color: #1A1206;
        font-family: var(--font-display);
        font-size: 14px;
        font-weight: 700;
        letter-spacing: 0.02em;
        border: none;
        border-radius: 8px;
        padding: 13px;
        cursor: pointer;
        transition: filter 0.15s ease;
    }

    button:hover { filter: brightness(1.08); }
    button:active { filter: brightness(0.94); }

    button:focus-visible {
        outline: 2px solid var(--cyan);
        outline-offset: 2px;
    }
</style>
</head>
<body>

<div class="panel">
    <div class="header">
        <p class="eyebrow">M5Stack Flight Tracker</p>
        <h1 class="title">Wi-Fi Setup</h1>
        <p class="subtitle" lang="ja">このデバイスをWi-Fiネットワークに接続してください</p>
    </div>

    <form action="/save" method="POST">

        <!-- SSID / パスワード -->
        <div class="field">
            <label for="ssid">Network Name (SSID)</label>
            <input type="text" id="ssid" name="ssid" required>
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input type="password" id="password" name="password">
        </div>

        <!-- 接続方式（DHCP／静的） -->
        <div class="field">
            <label for="connType">Connection Type</label>
            <select id="connType" name="connType" onchange="toggleStaticFields()">
                <option value="dhcp" selected>自動 (DHCP)</option>
                <option value="static">手動</option>
            </select>
        </div>

        <!-- 静的IP関連（「静的」選択時のみ表示） -->
        <div id="staticFields">
            <div class="field">
                <label for="ip">Device IP</label>
                <input type="text" id="ip" name="ip" placeholder="192.168.1.50">
            </div>
            <div class="field">
                <label for="gateway">Gateway</label>
                <input type="text" id="gateway" name="gateway" placeholder="192.168.1.1">
            </div>
            <div class="field">
                <label for="subnet">Subnet Mask</label>
                <input type="text" id="subnet" name="subnet" placeholder="255.255.255.0">
            </div>
            <div class="field">
                <label for="dns">DNS Server</label>
                <input type="text" id="dns" name="dns" placeholder="192.168.1.1">
                <span class="hint" lang="ja">空欄の場合はゲートウェイと同じアドレスを使用します</span>
            </div>
        </div>

        <button type="submit">Connect</button>
    </form>
</div>

<script>
    // 接続方式プルダウンの値に応じて、静的IP関連欄の表示・非表示を切り替える
    function toggleStaticFields() {
        const isStatic = document.getElementById("connType").value === "static";
        document.getElementById("staticFields").style.display = isStatic ? "block" : "none";
    }
</script>

</body>
</html>
